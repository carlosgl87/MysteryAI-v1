services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mysteryai
      POSTGRES_USER: mysteryai
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysteryai"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://mysteryai:local-demo-only@db:5432/mysteryai
      PORT: 8000
      SEED_DEMO: 1
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
